name: Website checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Use Node.js 24 LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          check-latest: true
      - name: Unit and integration tests
        run: node --test
      - name: Refresh release metadata and build
        run: node scripts/build.mjs
      - name: Static, consistency, header, link, and secret checks
        run: node scripts/verify-site.mjs
